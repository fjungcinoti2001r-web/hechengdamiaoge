<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>合成大苗哥·演员谢苗超话制作</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #FFF8EA;
            color: #5C4033;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(#FAD6A5 10%, transparent 11%);
            background-size: 30px 30px;
        }

        #arcade-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            border-left: 4px solid #FAD6A5;
            border-right: 4px solid #FAD6A5;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.5);
        }

        .top-bar {
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFEFD5;
            border-bottom: 3px solid #DEB887;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-layout {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .logo-img {
            width: 45px; 
            height: 45px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .title-group h1 {
            font-size: 18px;
            color: #D2691E;
            letter-spacing: 1px;
            font-weight: 900;
            white-space: nowrap;
            margin: 0;
        }
        .subtitle {
            font-size: 11px;
            color: #8B5A2B;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
        }

        #bgm-toggle {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #DEB887;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(210, 105, 30, 0.15);
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        #bgm-toggle:active { transform: scale(0.9); }
        .bgm-paused { opacity: 0.6; }
        @keyframes spinBgm { 100% { transform: rotate(360deg); } }
        .bgm-playing { animation: spinBgm 4s linear infinite; }

        .score-board {
            text-align: right;
            background: #FFFFFF;
            padding: 4px 10px;
            border-radius: 15px;
            border: 2px dashed #DEB887;
            white-space: nowrap;
        }
        .score-label {
            font-size: 14px;
            color: #FF9800;
            font-weight: 900;
            text-shadow: 0 0 6px rgba(255, 152, 0, 0.3);
        }
        .score-val {
            font-size: 22px;
            font-weight: 900;
            color: #FF9800;
            font-family: 'Arial Black', sans-serif;
            line-height: 1.1;
            text-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            margin: 0 auto;
            overflow: hidden;
            background: linear-gradient(180deg, #FFFDF9 0%, #FFF5E1 100%);
            box-shadow: inset 0 0 20px rgba(222, 184, 135, 0.3);
            touch-action: none;
        }

        #danger-line {
            position: absolute;
            left: 0;
            top: 15%;
            width: 100%;
            height: 2px;
            border-top: 2px dashed #FF6B6B;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
            pointer-events: none;
            z-index: 5;
        }
        
        #danger-label {
            position: absolute;
            right: 12px;
            top: -24px;
            font-size: 14px;
            color: #FF6B6B;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            animation: warningGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes warningGlow {
            0% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 107, 107, 0.3); transform: scale(0.98); }
            100% { text-shadow: 0 0 8px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 107, 107, 0.7); transform: scale(1.02); }
        }

        #dropper-preview {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            background-size: cover;
            background-position: center;
            border: 2px solid #D2691E;
            box-shadow: 0 0 10px rgba(210, 105, 30, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5C4033;
            font-weight: 900;
            text-shadow: 0 0 2px #FFF;
            text-align: center;
            padding: 4px;
            background-color: #FFE4C4;
        }

        .combo-text {
            position: absolute;
            font-weight: 900;
            color: #FFFDF9; 
            text-shadow: -1px -1px 0 #D2691E, 1px -1px 0 #D2691E, -1px 1px 0 #D2691E, 1px 1px 0 #D2691E, 0 0 12px #FFB6C1, 0 0 22px #FAD6A5, 0 0 30px #FFA07A; 
            pointer-events: none;
            z-index: 25;
            animation: comboFly 1s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes comboFly {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -70%) scale(1.3); }
            70% { opacity: 1; transform: translate(-50%, -100%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -130%) scale(0.85); }
        }

        .shake { animation: screenShake 0.15s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #game-over-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 234, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 10px;
            overflow-y: auto;
        }

        #capture-area {
            width: 92%;
            max-width: 360px;
            background: #FFF5E1;
            border: 4px solid #FAD6A5;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(200, 180, 160, 0.4);
        }

        /* 将顶部两张容易露白底的图片放进纯白胶囊形背景框里 */
        .poster-header-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border-radius: 30px;
            padding: 4px 12px;
            border: 2px solid #FAD6A5;
            margin-bottom: 6px;
        }
        .poster-badge {
            font-size: 14px;
            color: #8B5A2B;
            letter-spacing: 1px;
            font-weight: 900;
            white-space: nowrap;
            margin: 0 10px;
        }

        .poster-title {
            font-size: 26px;
            font-weight: 900;
            color: #D2691E;
            margin: 6px 0 12px 0;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(210, 105, 30, 0.2);
        }

        .score-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 8px 0;
            width: 100%;
        }

        .poster-egg-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px solid #FAD6A5;
            background-color: #FFFFFF;
            background-image: url('cb4044f2-fb41-445d-8c10-60121c918ad9.jfif');
            background-size: cover;
            background-position: center;
            margin: 0;
            flex-shrink: 0;
        }

        .poster-score-box {
            background: #FFFFFF;
            border: 2px dashed #DEB887;
            padding: 10px 20px;
            border-radius: 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .poster-score-label {
            font-size: 13px;
            color: #8B5A2B;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .poster-score-num {
            font-size: 36px;
            color: #D2691E;
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
            text-shadow: 0 0 10px rgba(210, 105, 30, 0.2);
        }

        .poster-role-tag {
            font-size: 14px;
            font-weight: 900;
            color: #D2691E;
            margin-top: 8px;
            padding: 6px 16px;
            background: #FFF0F5;
            border-radius: 15px;
            border: 2px dotted #FFB6C1;
            white-space: nowrap;
        }

        .poster-footer {
            font-size: 13px;
            color: #CD853F;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .mobile-poster-box {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
            width: 100%;
        }
        #final-poster-img {
            width: 85%;
            max-width: 320px;
            border-radius: 20px;
            border: 4px solid #FAD6A5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .save-tip {
            font-size: 13px;
            color: #D2691E;
            font-weight: 900;
            margin-top: 6px;
            background: #FFEFD5;
            padding: 4px 14px;
            border-radius: 15px;
            border: 2px dashed #DEB887;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            width: 85%;
            max-width: 320px;
        }
        .btn-core {
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            color: white;
            white-space: nowrap;
        }
        .btn-orange { background-color: #FFA07A; box-shadow: 0 4px 0 #E9967A; }
        .btn-pink { background-color: #FFB6C1; box-shadow: 0 4px 0 #FF69B4; }
        .btn-core:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<audio id="bgm" src="./my-bgm.mp3" loop preload="auto"></audio>

<div id="arcade-container">
    <div class="top-bar">
        <div class="header-layout">
            <img src="gonggu.png" alt="巩固" class="logo-img">
            <div class="title-group">
                <h1>合成大苗哥</h1>
                <div class="subtitle">演员谢苗超话制作</div>
            </div>
        </div>
        <div class="header-layout">
            <div id="bgm-toggle" class="bgm-paused">🔇</div>
            <div class="score-board">
                <div class="score-label">总战力</div>
                <div class="score-val" id="score">0</div>
            </div>
            <img src="xiemiao.png" alt="谢苗" class="logo-img">
        </div>
    </div>

    <div id="game-wrapper">
        <div id="danger-line"><span id="danger-label">苗友应激警戒线 ⚠️</span></div>
        <div id="dropper-preview"></div>

        <div id="game-over-mask">
            <div id="capture-area">
                <!-- 纯白胶囊底座：彻底包裹可能带白底的jpg/png图片 -->
                <div class="poster-header-pill">
                    <img src="gonggu.png" alt="巩固" style="width: 32px; height: 32px; object-fit: contain;">
                    <div class="poster-badge">✨ 苗友成绩单 ✨</div>
                    <img src="xiemiao.png" alt="谢苗" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
                <div class="poster-title">合成大苗哥</div>
                
                <div class="score-layout">
                    <!-- 背景图模式的彩蛋插图，避免拉伸 -->
                    <div class="poster-egg-img"></div>
                    <div class="poster-score-box">
                        <div class="poster-score-label">最终总战力</div>
                        <div class="poster-score-num" id="final-score">0</div>
                    </div>
                </div>

                <div class="poster-role-tag" id="max-role-tag">解锁最高形态：-</div>
                
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; white-space: nowrap;">
                    <img src="avatar-logo.png" alt="Logo" style="width: 30px; height: 30px; object-fit: contain; border-radius: 50%; border: 1.5px solid #FAD6A5;">
                    <div class="poster-footer">演员谢苗超话制作</div>
                </div>
            </div>

            <div class="mobile-poster-box" id="mobile-poster-box">
                <img id="final-poster-img" src="" alt="专属战绩卡">
                <div class="save-tip">👇 长按上方图片即可保存到相册 👇</div>
            </div>

            <div class="btn-group">
                <button class="btn-core btn-orange" id="gen-poster-btn" onclick="generatePoster()">📸 生成专属生涯战报</button>
                <button class="btn-core btn-pink" onclick="location.reload()">再玩一次 🔁</button>
            </div>
        </div>
    </div>
</div>

<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let bgmStarted = false;
    let userToggledBgm = false; 
    
    const bgmToggle = document.getElementById('bgm-toggle');
    const bgm = document.getElementById('bgm');

    bgmToggle.addEventListener('click', (e) => {
        e.stopPropagation(); 
        if (bgm.paused) {
            bgm.volume = 0.25;
            bgm.play();
            bgmToggle.innerText = '🎵';
            bgmToggle.classList.remove('bgm-paused');
            bgmToggle.classList.add('bgm-playing');
            userToggledBgm = false;
        } else {
            bgm.pause();
            bgmToggle.innerText = '🔇';
            bgmToggle.classList.add('bgm-paused');
            bgmToggle.classList.remove('bgm-playing');
            userToggledBgm = true;
        }
        bgmStarted = true; 
    });

    function startBGM() {
        if (!bgmStarted && !userToggledBgm) {
            bgm.volume = 0.25; 
            bgm.play().then(() => {
                bgmToggle.innerText = '🎵';
                bgmToggle.classList.remove('bgm-paused');
                bgmToggle.classList.add('bgm-playing');
            }).catch(e => console.log("等待用户交互以播放BGM", e));
            bgmStarted = true;
        }
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSoundEffect(type, comboLevel = 1) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'drop') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.05);
            
        } else if (type === 'correct') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);

        } else if (type === 'combo') {
            oscillator.type = 'sine';
            const baseFreq = 600 + (comboLevel * 80); 
            oscillator.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);

        } else if (type === 'triumph') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.4);
        }
    }

    let comboCount = 0;
    let lastMergeTime = 0;
    
    const COMBO_WORDS = [
        "SO COOL~",
        "苗友狂喜",
        "一路走来",
        "打好每一拳",
        "给苗哥递锤子",
        "中国功夫！",
        "真打！真狠！真解恨！",
        "打爆全球！",
        "hey hey！"
    ];

    function triggerComboPopup(x, y) {
        const now = Date.now();
        if (now - lastMergeTime < 950) {
            comboCount++;
        } else {
            comboCount = 1;
        }
        lastMergeTime = now;

        if (comboCount >= 2) {
            playSoundEffect('combo', comboCount);
            
            const word = COMBO_WORDS[Math.floor(Math.random() * COMBO_WORDS.length)];
            const span = document.createElement('div');
            span.className = 'combo-text';
            span.innerText = `${word} x${comboCount}!`;
            span.style.left = `${x}px`;
            span.style.top = `${y}px`;
            span.style.fontSize = `${Math.min(26, 16 + comboCount * 2)}px`;
            wrapper.appendChild(span);
            setTimeout(() => span.remove(), 850);
        }
    }

    const wrapper = document.getElementById('game-wrapper');
    const previewEl = document.getElementById('dropper-preview');
    const scoreEl = document.getElementById('score');
    const gameOverMask = document.getElementById('game-over-mask');
    const finalScoreEl = document.getElementById('final-score');
    const maxRoleTag = document.getElementById('max-role-tag');

    const rect = wrapper.getBoundingClientRect();
    let width = rect.width;
    let height = rect.height;

    const scaleFactor = Math.min(1.15, Math.max(0.9, width / 380));

    const RAW_ROLES = [
        { level: 0,  name: "洪文定", year: "1994", baseR: 20 },
        { level: 1,  name: "海远",   year: "1995", baseR: 25 },
        { level: 2,  name: "巩固",   year: "1995", baseR: 30 },
        { level: 3,  name: "嬴政",   year: "2001", baseR: 36 },
        { level: 4,  name: "惠忍",   year: "2008", baseR: 43 },
        { level: 5,  name: "失烈门", year: "2013", baseR: 50 },
        { level: 6,  name: "韩晓峰", year: "2017", baseR: 57 },
        { level: 7,  name: "耿恭",   year: "2019", baseR: 64 },
        { level: 8,  name: "辛弃疾", year: "2020", baseR: 71 },
        { level: 9,  name: "杨烈钧", year: "2020", baseR: 78 },
        { level: 10, name: "李红旗", year: "2021", baseR: 85 },
        { level: 11, name: "成瞎子", year: "2022", baseR: 92 },
        { level: 12, name: "张柳成/平", year: "2022", baseR: 99 },
        { level: 13, name: "黄铭金", year: "2024", baseR: 106 },
        { level: 14, name: "王伟",   year: "2026", baseR: 114 },
        { level: 15, name: "苗哥本人", year: "2026+", baseR: 124 }
    ];

    const ROLES = RAW_ROLES.map(item => ({
        level: item.level,
        name: item.name,
        year: item.year,
        radius: Math.round(item.baseR * scaleFactor)
    }));

    const roleImages = [];
    function initImageAssets() {
        ROLES.forEach((role, index) => {
            const num = index + 1;
            const img = new Image();
            const candidatePaths = [
                `./images/role(${num}).png`,
                `./images/role(${num}).jpg`,
                `./images/role${num}.png`,
                `./images/role${num}.jpg`
            ];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < candidatePaths.length) {
                    img.src = encodeURI(candidatePaths[attempt]);
                }
            };
            img.src = encodeURI(candidatePaths[0]);
            roleImages.push(img);
        });
    }
    initImageAssets();

    let score = 0;
    let highestLevel = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentDropLevel = 0;
    let currentX = width / 2;

    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const engine = Engine.create({ enableSleeping: false });
    engine.gravity.y = 1.3;

    // 增加 pixelRatio 支持，彻底解决高刷屏手机上小球渲染模糊的问题
    const render = Render.create({
        element: wrapper,
        engine: engine,
        options: {
            width: width,
            height: height,
            pixelRatio: window.devicePixelRatio || 2,
            wireframes: false,
            background: 'transparent'
        }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    const wallThick = 60;
    const ground = Bodies.rectangle(width / 2, height + wallThick / 2, width * 2, wallThick, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const leftWall = Bodies.rectangle(-wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const rightWall = Bodies.rectangle(width + wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
            if (body.roleInfo) {
                const { x, y } = body.position;
                const r = body.roleInfo.radius;
                const img = roleImages[body.roleInfo.level];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(body.angle);

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.clip();

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -r, -r, r * 2, r * 2);
                } else {
                    ctx.fillStyle = "#FFE4C4";
                    ctx.fill();
                    
                    const calculatedFontSize = Math.max(12, Math.round(r * 0.32));
                    ctx.fillStyle = "#5C4033";
                    ctx.font = `900 ${calculatedFontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.strokeText(body.roleInfo.name, 0, 0);
                    ctx.fillText(body.roleInfo.name, 0, 0);
                }

                ctx.restore();
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.lineWidth = body.roleInfo.level >= 13 ? 4 : 2.5;
                ctx.strokeStyle = body.roleInfo.level >= 13 ? '#FF8C00' : '#D2691E';
                ctx.stroke();
                ctx.restore();
            }
        });
    });

    function setupNextDrop() {
        let maxDropLevel = 3;
        if (score > 600) maxDropLevel = 4;
        if (score > 1500) maxDropLevel = 5;

        currentDropLevel = Math.floor(Math.random() * maxDropLevel);
        const info = ROLES[currentDropLevel];
        const r = info.radius;

        previewEl.style.width = (r * 2) + 'px';
        previewEl.style.height = (r * 2) + 'px';

        const img = roleImages[currentDropLevel];
        if (img && img.src && img.complete && img.naturalWidth !== 0) {
            previewEl.style.backgroundImage = `url('${img.src}')`;
            previewEl.innerText = "";
        } else {
            previewEl.style.backgroundImage = "none";
            previewEl.style.backgroundColor = "#FFE4C4";
            previewEl.innerText = info.name;
            previewEl.style.fontSize = Math.max(11, Math.round(r * 0.32)) + 'px';
        }

        updatePreviewPos(currentX);
    }

    function updatePreviewPos(x) {
        const r = ROLES[currentDropLevel].radius;
        const clampedX = Math.max(r + 2, Math.min(width - r - 2, x));
        currentX = clampedX;
        previewEl.style.left = clampedX + 'px';
    }

    function dropRole() {
        if (!canDrop || isGameOver) return;
        canDrop = false;

        const info = ROLES[currentDropLevel];
        const circle = Bodies.circle(currentX, height * 0.05, info.radius, {
            restitution: 0.15,
            friction: 0.15,
            density: 0.003,
            render: { visible: false }
        });
        circle.roleInfo = info;
        Composite.add(engine.world, circle);

        playSoundEffect('drop');
        previewEl.style.display = 'none';

        setTimeout(() => {
            if (!isGameOver) {
                setupNextDrop();
                previewEl.style.display = 'flex';
                canDrop = true;
            }
        }, 500);
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const bodyA = pair.bodyA;
            const bodyB = pair.bodyB;

            if (bodyA.roleInfo && bodyB.roleInfo) {
                if (bodyA.roleInfo.level === bodyB.roleInfo.level) {
                    const nextLevel = bodyA.roleInfo.level + 1;
                    if (nextLevel < ROLES.length && !bodyA.isRemoved && !bodyB.isRemoved) {
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;
                        const nextInfo = ROLES[nextLevel];

                        Composite.remove(engine.world, [bodyA, bodyB]);

                        const newCircle = Bodies.circle(midX, midY, nextInfo.radius, {
                            restitution: 0.15,
                            friction: 0.15,
                            density: 0.003,
                            render: { visible: false }
                        });
                        newCircle.roleInfo = nextInfo;
                        Composite.add(engine.world, newCircle);

                        if (nextLevel >= 10) {
                            wrapper.classList.add('shake');
                            setTimeout(() => wrapper.classList.remove('shake'), 160);
                        }

                        if (nextLevel > highestLevel) highestLevel = nextLevel;

                        score += (nextLevel + 1) * 3;
                        scoreEl.innerText = score;

                        if (nextLevel >= 13) playSoundEffect('triumph');
                        else playSoundEffect('correct');

                        triggerComboPopup(midX, midY);
                    }
                }
            }
        });
    });

    const DANGER_Y = height * 0.15;
    setInterval(() => {
        if (isGameOver) return;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(b => {
            if (b.roleInfo && (b.position.y - b.roleInfo.radius < DANGER_Y)) {
                if (Math.abs(b.velocity.y) < 0.2 && Math.abs(b.velocity.x) < 0.2 && b.position.y > (height * 0.08)) {
                    triggerGameOver();
                }
            }
        });
    }, 1000);

    function triggerGameOver() {
        isGameOver = true;
        previewEl.style.display = 'none';
        finalScoreEl.innerText = score;
        maxRoleTag.innerText = `解锁最高形态：${ROLES[highestLevel].year} · ${ROLES[highestLevel].name}`;
        gameOverMask.style.display = 'flex';
    }

    function generatePoster() {
        const captureArea = document.getElementById('capture-area');
        const mobilePosterBox = document.getElementById('mobile-poster-box');
        const finalPosterImg = document.getElementById('final-poster-img');
        const genBtn = document.getElementById('gen-poster-btn');

        // 锁定高精度缩放配置，杜绝任何形变拉伸
        html2canvas(captureArea, {
            scale: 3,
            backgroundColor: "#FFF5E1",
            width: captureArea.offsetWidth,
            height: captureArea.offsetHeight,
            useCORS: true
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            finalPosterImg.src = imgData;

            captureArea.style.display = 'none';
            genBtn.style.display = 'none';
            mobilePosterBox.style.display = 'flex';
        });
    }

    function handlePointerCoord(e) {
        const box = wrapper.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePreviewPos(clientX - box.left);
    }

    wrapper.addEventListener('touchstart', (e) => { startBGM(); handlePointerCoord(e); }, { passive: true });
    wrapper.addEventListener('touchmove', (e) => { if (canDrop) handlePointerCoord(e); }, { passive: true });
    wrapper.addEventListener('touchend', () => { dropRole(); });

    wrapper.addEventListener('mousedown', (e) => { startBGM(); handlePointerCoord(e); });
    wrapper.addEventListener('mousemove', (e) => { if (canDrop) handlePointerCoord(e); });
    wrapper.addEventListener('mouseup', () => { dropRole(); });

    setupNextDrop();
</script>

</body>
</html>
